<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P2P Vault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0d131f);
      --card-bg: var(--tg-theme-secondary-bg-color, #161f30);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --primary: var(--tg-theme-button-color, #3b82f6);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
      --success: #10b981;
      --border: rgba(255, 255, 255, 0.08);
      --glass: rgba(255, 255, 255, 0.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 6px #eab308;
    }
    .dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    /* Tabs Navigation */
    .tabs-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }
    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .code-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed var(--primary);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin: 14px 0;
    }
    .code-display {
      font-family: monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--primary);
      display: block;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .btn-success { background: var(--success); }
    /* Inputs */
    .room-input {
      width: 100%;
      padding: 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
      color: var(--text);
      letter-spacing: 3px;
      font-family: monospace;
      text-transform: uppercase;
      outline: none;
      margin: 12px 0;
    }
    .room-input:focus { border-color: var(--primary); }
    /* Progress */
    .progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.1s linear;
    }
    /* Media Section */
    #mediaSection {
      display: none;
      text-align: center;
    }
    #mediaSection img, #mediaSection video {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: 700; font-size: 17px;">🔒 P2P Vault</div>
    <div class="badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusLabel">Listo</span>
    </div>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" id="tabSendBtn" onclick="switchTab('send')">📤 Enviar</button>
    <button class="tab-btn" id="tabReceiveBtn" onclick="switchTab('receive')">📥 Recibir</button>
  </div>

  <!-- Vista Enviar -->
  <div id="viewSend">
    <div class="card">
      <h3 style="margin: 0 0 6px 0;">Crear Transferencia</h3>
      <p style="font-size: 13px; color: var(--hint); margin: 0;">
        Pasa este código a tu par o comparte el link para iniciar la transferencia directa.
      </p>

      <div class="code-box">
        <span style="font-size: 11px; text-transform: uppercase; color: var(--hint);">Código de Sala</span>
        <span class="code-display" id="displayRoomCode">------</span>
      </div>

      <button class="btn btn-secondary" onclick="copyCode()">📋 Copiar Código</button>
      <button class="btn btn-secondary" onclick="shareRoomLink()">🔗 Compartir Link al Chat</button>

      <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px;">
        <input type="file" id="filePicker" style="display:none;" />
        <button class="btn" onclick="document.getElementById('filePicker').click()">📁 Seleccionar Archivo</button>
        <div id="selectedFileInfo" style="display:none; font-size: 13px; margin-top: 8px; text-align: center; color: var(--hint);"></div>
      </div>
    </div>
  </div>

  <!-- Vista Recibir -->
  <div id="viewReceive" style="display: none;">
    <div class="card">
      <h3 style="margin: 0 0 6px 0;">Unirse a Sala</h3>
      <p style="font-size: 13px; color: var(--hint); margin: 0;">
        Ingresa el código de 6 caracteres provisto por el emisor:
      </p>

      <input type="text" id="manualRoomInput" class="room-input" placeholder="EJ: 4F8A2B" maxlength="8" />
      <button class="btn" id="btnConnectManual" onclick="joinManualRoom()">⚡ Conectar a la Sala</button>
    </div>
  </div>

  <!-- Barra de progreso común -->
  <div class="card progress-wrap" id="progressContainer">
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <span id="transferStatus">Transmitiendo...</span>
      <b id="progressPercent">0%</b>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Visor de archivo recibido -->
  <div class="card" id="mediaSection">
    <h4 style="margin:0 0 10px 0; color: var(--success);">🎉 Archivo Recibido</h4>
    <div id="mediaViewer"></div>
    <button class="btn btn-success" id="btnDownload">💾 Guardar en Dispositivo</button>
  </div>

  <script type="module">
    import { saveMedia } from './indexedDB.js';
    import { P2PTransport } from './webrtc.js';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BOT_USERNAME = "miniapptgexcbot";

    // Elementos DOM
    const tabSendBtn = document.getElementById('tabSendBtn');
    const tabReceiveBtn = document.getElementById('tabReceiveBtn');
    const viewSend = document.getElementById('viewSend');
    const viewReceive = document.getElementById('viewReceive');
    const displayRoomCode = document.getElementById('displayRoomCode');
    const manualRoomInput = document.getElementById('manualRoomInput');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const mediaSection = document.getElementById('mediaSection');
    const mediaViewer = document.getElementById('mediaViewer');
    const btnDownload = document.getElementById('btnDownload');
    const selectedFileInfo = document.getElementById('selectedFileInfo');

    let currentRoom = null;
    let localFileId = null;

    // Instancia de transporte P2P
    const p2p = new P2PTransport({
      onStatus: (msg, connected) => {
        statusLabel.innerText = msg;
        if (connected) {
          statusDot.classList.add('active');
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
          statusDot.classList.remove('active');
        }
      },
      onRoomJoined: (room) => {
        currentRoom = room;
        displayRoomCode.innerText = room;
      },
      onChannelReady: () => {
        if (localFileId) {
          p2p.sendFile(localFileId);
        }
      },
      onProgress: (pct) => {
        progressContainer.style.display = 'block';
        progressFill.style.width = `${pct}%`;
        progressPercent.innerText = `${pct.toFixed(0)}%`;
      },
      onReceived: (blob, meta) => {
        progressContainer.style.display = 'none';
        renderMedia(blob, meta);
      }
    });

    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProto}//${window.location.host}/ws/signal`;

    // Cambiar de Pestaña
    window.switchTab = (tab) => {
      if (tab === 'send') {
        tabSendBtn.classList.add('active');
        tabReceiveBtn.classList.remove('active');
        viewSend.style.display = 'block';
        viewReceive.style.display = 'none';
      } else {
        tabReceiveBtn.classList.add('active');
        tabSendBtn.classList.remove('active');
        viewReceive.style.display = 'block';
        viewSend.style.display = 'none';
      }
    };

    // Lectura de parámetros de sala por URL
    const urlParams = new URLSearchParams(window.location.search);
    const paramRoom = tg?.initDataUnsafe?.start_param || urlParams.get('room') || urlParams.get('tgWebAppStartParam');

    if (paramRoom) {
      // Si viene con parámetro, cambiar a pestaña Recibir y conectar
      switchTab('receive');
      manualRoomInput.value = paramRoom.toUpperCase();
      p2p.connectSignaling(wsUrl, paramRoom);
    } else {
      // Generar código corto de 6 caracteres (ej: 4F8A2B)
      const generated = Math.random().toString(36).substring(2, 8).toUpperCase();
      displayRoomCode.innerText = generated;
      p2p.connectSignaling(wsUrl, generated);
    }

    // Acción: Conectar Manualmente
    window.joinManualRoom = () => {
      const code = manualRoomInput.value.trim().toUpperCase();
      if (!code) return;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      p2p.connectSignaling(wsUrl, code);
    };

    // Acción: Copiar Código
    window.copyCode = () => {
      const code = displayRoomCode.innerText;
      navigator.clipboard.writeText(code);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      alert(`Código ${code} copiado.`);
    };

    // Acción: Compartir Enlace
    window.shareRoomLink = () => {
      const code = displayRoomCode.innerText;
      // Usar t.me/bot?start=CODIGO (compatible universalmente)
      const shareUrl = `https://t.me/${BOT_USERNAME}?start=${code}`;
      const msg = `⚡ Conéctate a mi sala P2P para recibir el archivo:\nSala: ${code}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(msg)}`);
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert('Enlace copiado al portapapeles.');
      }
    };

    // Selección de archivo
    document.getElementById('filePicker').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      localFileId = crypto.randomUUID();
      await saveMedia(localFileId, file, { name: file.name, type: file.type, size: file.size });

      selectedFileInfo.innerText = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      selectedFileInfo.style.display = 'block';

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (p2p.isChannelReady()) {
        p2p.sendFile(localFileId);
      }
    });

    function renderMedia(blob, meta) {
      viewReceive.style.display = 'none';
      viewSend.style.display = 'none';
      mediaSection.style.display = 'block';
      mediaViewer.innerHTML = '';
      const url = URL.createObjectURL(blob);

      if (meta.type && meta.type.startsWith('video/')) {
        const vid = document.createElement('video');
        vid.src = url;
        vid.controls = true;
        mediaViewer.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = url;
        mediaViewer.appendChild(img);
      }

      btnDownload.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = meta.name || 'descarga_p2p';
        a.click();
      };
    }
  </script>
</body>
</html>
